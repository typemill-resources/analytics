name: Analytics
version: 2.3.0
description: Integrate Matomo, Fathom, Plausible, Privatus Analytics or Google Analytics into your website.
author: Trendschau
homepage: http://typemill.net
repo: https://github.com/typemill-resources/analytics
license: MIT

settings:
  tool: none
  privatus_engage: true
  privatus_auto: true
  privatus_vitals: true
  privatus_clicks: true
  privatus_ask: true

forms:
  fields:

    tool:
      type: radio
      label: "Choose Your Tool"
      options:
        none: None
        matomo: Matomo
        google: Google Analytics
        fathom: Fathom
        plausible: Plausible
        privatus: Privatus Analytics

    matomo:
      type: fieldset
      legend: "Matomo"
      fields:

        matomo_url:
          type: text
          label: "Matomo URL"
          placeholder: 'my-matomo-installation.com'
          description: "Add the URL to your matomo installation without the protocol (https://)."

        matomo_id:
          type: number
          label: "Matomo Site-ID"
          placeholder: "8"
          description: "You can find the id in Matomo under configuration and tracking code."

        matomo_cloud:
          type: checkbox
          label: "Matomo Cloud"
          checkboxlabel: "Use Matomo Cloud hosting"
          description: "Check this if your Matomo URL is a Matomo Cloud subdomain (e.g. mysite.matomo.cloud). It loads the tracker script from cdn.matomo.cloud."

        matomo_nocookie:
          type: checkbox
          label: "Cookies"
          checkboxlabel: "Track without cookies"

    fathom:
      type: fieldset
      legend: "Fathom"
      fields:

        fathom_url:
          type: url
          label: "Fathom Script URL"
          placeholder: 'https://cdn.usefathom.com/script.js'
          description: "If you use a custom domain, you can find the Script URL in sites > settings under https://app.usefathom.com/. If empty the default script.js will be used."

        fathom_id:
          type: text
          label: "Fathom SiteID"
          placeholder: 'VZNKNKJP'
          description: "If you use a custom domain, you can find the Script URL in sites > settings under https://app.usefathom.com/."

    plausible:
      type: fieldset
      legend: "Plausible"
      fields:

        plausible_domain:
          type: text
          label: "Plausible Data Domain"
          placeholder: 'yourdomain.com'
          description: "The domain you have added to Plausible (without https://)."

        plausible_url:
          type: url
          label: "Plausible Script URL"
          placeholder: 'https://plausible.io/js/script.js'
          description: "If you use a custom domain or self-hosted Plausible, enter your script URL. If empty, the default https://plausible.io/js/script.js will be used."

    privatus:
      type: fieldset
      legend: "Privatus Analytics"
      fields:

        privatus_id:
          type: text
          label: "Privatus Analytics Site ID"
          placeholder: 'pa_7Q2K9XH3AB'
          description: "It starts with pa_. You find it in Privatus Analytics under Site settings, Tracking."

        privatus_engage:
          type: checkbox
          label: "Time on Page"
          checkboxlabel: "Track time on page and scroll depth"

        privatus_auto:
          type: checkbox
          label: "Links, Downloads and Forms"
          checkboxlabel: "Track outbound links, file downloads, form submits and 404 pages"

        privatus_vitals:
          type: checkbox
          label: "Web Vitals"
          checkboxlabel: "Track page speed (Core Web Vitals)"

        privatus_clicks:
          type: checkbox
          label: "Click Maps"
          checkboxlabel: "Record click maps"

        privatus_ask:
          type: checkbox
          label: "Surveys"
          checkboxlabel: "Show on-site surveys"

    google:
      type: fieldset
      legend: "Google Analytics"
      fields:
    
        google_id:
          type: text
          label: "Google Measurement ID"
          placeholder: "G-XXXXXXXXXX"
          description: "You can find the Measurement ID in Google Analytics under your data stream settings. It starts with 'G-'."